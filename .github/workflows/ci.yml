name: HealthCare CI/CD

on:
  push:
    branches: [ "main", "part4" ]
  pull_request:
    branches: [ "main", "part4" ]

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: healthCare_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test
        run: mvn clean verify
        working-directory: HealthCare
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/healthCare_db
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379
          APP_SECRET_KEY: mysecretkeymysecretkeymysecretkey