spring.application.name=healthCare_db

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/healthCare_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Samira12}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.cache.type=redis

app.secret-key=${APP_SECRET_KEY:mysecretkeymysecretkeymysecretkey}
app.expiration-time=3600000