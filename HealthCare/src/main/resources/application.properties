spring.application.name=healthCare_db
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-healthcare:3306/healthCare_db?createDatabaseIfNotExist=true&serverTimezone=UTC}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Samira12}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
