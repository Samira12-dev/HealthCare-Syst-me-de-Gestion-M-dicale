version: '3.8'

services:

  db:
    image: mysql:8.0
    container_name: healthcare-db

    environment:
      MYSQL_DATABASE: healthCare_db
      MYSQL_ROOT_PASSWORD: Samira12

    networks:
      - health-net

    volumes:
      - mysql_data:/var/lib/mysql



  app:
    build: ..

    container_name: healthcare-app

    ports:
      - "8080:8080"

    depends_on:
      - db

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/healthCare_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Samira12

    networks:
      - health-net

networks:
  health-net:
    driver: bridge

volumes:
  mysql_data: